{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav>
        <img src="{% static 'images/logo.png' %}" alt="Website Logo" class="logo">
    <a href="/">Home</a>

    <a href="{% url 'about' %}">
        About
    </a>

    <a href="{% url 'student_list' %}">
        Students
    </a>

    {% if user.is_authenticated %}

        <span>
            Hello {{ user.username }}
        </span>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

    {% endif %}

</nav>

    {% block content %}
    {% endblock %}
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
